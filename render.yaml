services:
  # Backend: API en Node/Express. Plan free de Render duerme tras ~15 min sin trafico
  # y tarda unos segundos en despertar con la siguiente peticion (el frontend ya avisa
  # de esto con el banner "Despertando servidor...").
  - type: web
    name: sublimados-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false # connection string real de MongoDB Atlas, se pega a mano en el dashboard de Render
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto aleatorio seguro solo
      - key: CORS_ORIGIN
        sync: false # URL del sitio estatico del frontend una vez desplegado (ver abajo)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOMBRE
        sync: false

  # Frontend: sitio estatico generado por Vite.
  - type: web
    name: sublimados-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # URL del backend + /api, ej. https://sublimados-server.onrender.com/api
    routes:
      # Todas las rutas del SPA (React Router) deben servir index.html, si no un refresh
      # en /ventas, /dashboard, etc. da 404.
      - type: rewrite
        source: /*
        destination: /index.html
